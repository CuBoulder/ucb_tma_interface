# @see Configuration schema/metadata at https://drupal.org/node/1905070
#
field.field_building.value:
  type: sequence
  label: "Default value"
  sequence:
    - type: mapping
      label: "Default"
      mapping:
        value:
          type: string
          label: "Value"

ucb_tma_interface.settings:
  type: config_object
  label: "TMA Interface Config"
  mapping:
    message:
      type: text
      label: "Message"
    debug_api_logging:
      type: boolean
      label: "Enable verbose TMA API debug logging"
    platform_request_type_code:
      type: string
      label: "Platform API WorkRequest request type code (e.g. WEB for Fix It)"
