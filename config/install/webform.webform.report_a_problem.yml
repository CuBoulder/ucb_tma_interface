id: report_a_problem
title: 'Report a problem'
description: ''
categories: {  }
elements: |-
  know_your_issue_:
    '#type': webform_wizard_page
    '#title': 'Know your Issue? '
    categories:
      '#type': webform_entity_radios
      '#title': 'Know Your Issue? '
      '#target_type': taxonomy_term
      '#selection_handler': 'default:taxonomy_term'
      '#selection_settings':
        target_bundles:
          categories: categories
        sort:
          field: name
          direction: ASC
    actions:
      '#type': webform_actions
      '#title': 'Submit button(s)'
      '#attributes':
        class:
          - page-button
      '#submit__label': Submit
      '#wizard_prev__label': Back
      '#wizard_next__label': Next
      '#wizard_next__attributes':
        class:
          - '[webform_submission:current-page]_next_button'
      '#preview_prev__label': Back
      '#preview_next__label': Next
  step_1:
    '#type': webform_wizard_page
    '#title': 'Issue Type'
    '#prev_button_label': Back
    '#next_button_label': Next
    issue_type_wrapper:
      '#type': fieldset
      '#title': 'Issue Type Wrapper'
      '#title_display': invisible
      '#attributes':
        class:
          - card-wrapper
      task_select:
        '#type': webform_entity_select
        '#title': 'Issue Type'
        '#required': true
        '#empty_option': '- Select an issue type -'
        '#target_type': node
        '#selection_handler': views
        '#selection_settings':
          view:
            view_name: task_selection
            display_name: entity_reference_1
            arguments:
              - '[webform_submission:values:categories:entity:tid]'
      input_information_related_to_the_issue:
        '#type': textarea
        '#title': 'Input information related to the issue'
        '#placeholder': 'Add comments here'
        '#required': true
        '#counter_type': character
        '#counter_maximum': 150
      actions_01:
        '#type': webform_actions
        '#title': 'Submit button(s)'
        '#attributes':
          class:
            - page-button
        '#submit__label': Submit
        '#wizard_prev__label': Back
        '#wizard_next__label': Next
        '#wizard_next__attributes':
          class:
            - '[webform_submission:current-page]_next_button'
        '#preview_prev__label': Back
        '#preview_next__label': Next
    faq:
      '#type': webform_markup
      '#wrapper_attributes':
        style: 'display:none'
      '#markup': '[webform_submission:values:categories:entity:tid]'
  step_2:
    '#type': webform_wizard_page
    '#title': 'Location & Contact'
    '#prev_button_label': Back
    '#next_button_label': Next
    location_and_contact_wrapper:
      '#type': fieldset
      '#title': 'Location and Contact Wrapper'
      '#title_display': invisible
      '#attributes':
        class:
          - card-wrapper
      facility:
        '#type': select
        '#title': Facility
        '#options': tma_facilities
        '#required': true
      building:
        '#type': select
        '#title': Building
        '#options':
          Placeholder: Placeholder
        '#required': true
        '#states':
          enabled:
            ':input[name="facility"]':
              filled: true
      area:
        '#type': select
        '#title': Area
        '#options':
          Placeholder: Placeholder
        '#required': true
        '#states':
          enabled:
            ':input[name="building"]':
              filled: true
      user_contact:
        '#type': webform_contact
        '#title': Contact
        '#required': true
        '#name__placeholder': 'Name Here'
        '#name__title_display': before
        '#name__required': true
        '#company__access': false
        '#email__placeholder': 'Email Here'
        '#email__title_display': before
        '#email__required': true
        '#phone__placeholder': 'Phone Here'
        '#phone__title_display': before
        '#phone__required': true
        '#address__access': false
        '#address_2__access': false
        '#city__access': false
        '#state_province__access': false
        '#postal_code__access': false
        '#country__access': false
      actions_02:
        '#type': webform_actions
        '#title': 'Submit button(s)'
        '#attributes':
          class:
            - page-button
        '#submit__label': Submit
        '#wizard_prev__label': Back
        '#wizard_next__label': Next
        '#wizard_next__attributes':
          class:
            - '[webform_submission:current-page]_next_button'
        '#preview_prev__label': Back
        '#preview_next__label': Next
      floor:
        '#type': hidden
        '#title': floor
  ticket_id:
    '#type': hidden
    '#title': 'Ticket ID'
  repair_center:
    '#type': hidden
    '#title': 'Repair Center'
